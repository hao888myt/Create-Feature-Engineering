	# Default: 5000
	# Range: 1 ~ 1000000
	weatherproof_chestplate_flight_consumption = 5000
	#Controls the maximum energy of the Building Rod (in FE)
	# Default: 8000000
	# Range: 1 ~ 2000000000
	building_rod_max_energy = 8000000
	#Controls how long the mob effect an amulet grants lasts while its condition holds (in ticks)
	# Default: 210
	# Range: 1 ~ 100000
	amulet_effect_refresh_ticks = 210

#Adjusts the commands the Spacetime Supercomputer may execute
[commands]
	#Controls whether to allow the /locate biome command
	allow_locate_biome_command = true
	#Controls whether to allow the /locate structure command
	allow_locate_structure_command = true
	#Controls whether to allow the /locate poi command
	allow_locate_poi_command = true
	#Controls whether to allow the /time add command
	allow_time_add_command = true
	#Controls whether to allow the /tick sprint command
	allow_tick_sprint_command = true
	#Controls how many power grid entries the power grid command shows
	# Default: 256
	# Range: 1 ~ 4096
	powergrid_info_limit = 256
