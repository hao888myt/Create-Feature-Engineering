#Adjusts settings related to world physics, anvil impacts, and block behavior
[world]
	#Controls the number of orbital integration substeps per tick for freely falling items and blocks (1 = legacy motion)
	# Default: 8
	# Range: 1 ~ 64
	orbit_integration_substeps = 8
	#Controls whether to enable Schwarzschild periapsis advance around attractive gravity sources
	relativistic_precession = true
	#Controls the minimum strength a gravity source needs to produce relativistic precession
	# Default: 10.0
	# Range: 0.0 ~ 1000.0
	relativistic_precession_min_strength = 10.0
	#Controls the effective speed of light in blocks per tick used by orbital precession; larger values weaken the effect
	# Default: 64
	# Range: 16 ~ 4096
	orbital_speed_of_light = 64
	#Controls the maximum depth a lightning strike can reach
	# Default: 2
	# Range: 1 ~ 16
	lightning_strike_depth = 2
	#Controls the maximum radius a lightning strike can reach
	lightning_strike_radius = 1
	#Controls the maximum radius of the Giant Anvil's shock behavior
	# Default: 16
	# Range: 4 ~ 16
	giant_anvil_max_shock_radius = 16
	#Controls the maximum fall damage dealt by the Giant Anvil
	# Default: 40
	# Range: 0 ~ 100
	giant_anvil_max_fall_damage = 40
	#Controls the minimum collision speed at which anvils explode instead of merely stopping (in blocks/tick)
	anvil_collision_craft_speed = 16
	#Controls the length of redstone EMP generated per block dropped by the anvil
	# Default: 6
	# Range: 1 ~ 64
	redstone_emp_radius = 6
	#Controls the maximum length of redstone EMP
	# Default: 24
	# Range: 1 ~ 64
	redstone_emp_max_radius = 24
	#Controls the maximum distance for the Block Placer to recursively retrieve items from containers
	# Default: 7
	# Range: 0 ~ 20
	block_placer_max_recursive_retrieval_distance = 7
	#Controls whether the Block Devourer devours blocks upward in a chain (see #anvilcraft:block_devourer_chain_devouring)
	block_devourer_upward_chain_devouring = true
	#Controls the maximum distance of the Block Devourer's upward chain devouring
	# Default: 8
	# Range: 0 ~ 15
	block_devourer_upward_chain_devouring_distance = 8
	#Controls whether the Block Devourer protects containers (blocks that can store items) from being devoured
	block_devourer_protect_containers = false
	#Controls whether pushing or pulling a sliding rail chains to other rails
	sliding_rail_stick_to_each_other = false
	#Controls the range in which the Active Silencer mutes sounds (in blocks)
	# Default: 31
	# Range: 3 ~ 64
	active_silencer_range = 31
	#Controls the minimum size of the crafting table multiblock the Giant Anvil can craft
	# Default: 3
	# Range: 3 ~ 15
	giant_anvil_multiblock_min_size = 3
	#Controls the maximum size of the crafting table multiblock the Giant Anvil can craft
	# Default: 15
	# Range: 3 ~ 31
	giant_anvil_multiblock_max_size = 15
	#Controls the safe fall distance in the Mun dimension (in blocks)
	# Default: 20.0
	# Range: 0.0 ~ 512.0
	mun_safe_fall_distance = 20.0
	#Controls the blocks per damage point of fall damage in the Mun dimension
	# Default: 6.0
	# Range: 0.0 ~ 64.0
	mun_blocks_per_damage = 6.0
	#Controls the delay before an Overworld-like dimension collapses (in ticks)
	# Default: 40
	# Range: 1 ~ 1200
	overworld_like_collapse_delay_ticks = 40
	#Controls the bonus Neutronium Ingot chance per enchantment level when transcending (in %)
	# Default: 10
	# Range: 0 ~ 100
	transcendium_bonus_ingot_chance_per_enchantment = 10
	#Controls the experience points granted per block of Liquid Experience
	# Default: 50
	# Range: 0 ~ 1000
	exp_fluid_xp_per_block = 50
	#Controls how many neighbouring Void Matter blocks are needed for Void Matter to decay
	# Default: 5
	# Range: 1 ~ 6
	void_matter_decay_threshold = 5
	#Controls the chance that a settled source of Cement solidifies per random tick
	# Default: 0.1
	# Range: 0.0 ~ 1.0
	cement_solidify_chance = 0.1
	#Controls the chance that a Hollow Magnet converts the block it pulls
	# Default: 0.005
	# Range: 0.0 ~ 1.0
	hollow_magnet_convert_chance = 0.005
	#Controls the chance that the Block Devourer suppresses the drops of the block it eats
	# Default: 0.05
	# Range: 0.0 ~ 1.0
	block_devourer_drop_suppression_chance = 0.05
	#Controls the chance that Redhot blocks absorb water
	# Default: 0.5
	# Range: 0.0 ~ 1.0
	redhot_water_absorb_chance = 0.5
	#Controls the chance that Ember blocks absorb water
	# Default: 0.5
	# Range: 0.0 ~ 1.0
	ember_block_water_absorption_chance = 0.5
	#Controls the damage a falling Anvil deals per block fallen
	# Default: 2.0
	# Range: 0.0 ~ 100.0
	anvil_fall_damage_per_block = 2.0
	#Controls the damage a falling Giant Anvil deals per block fallen
	# Default: 10.0
	# Range: 0.0 ~ 1000.0
	giant_anvil_fall_damage_per_block = 10.0
	#Controls the speed a powered Sliding Rail launches entities with
	# Default: 0.3499999940395355
	# Range: 0.0 ~ 10.0
	sliding_rail_launch_speed = 0.3499999940395355
	#Controls the strength an unpowered Sliding Rail pulls entities with
	# Default: 0.15000000596046448
	# Range: 0.0 ~ 10.0
	sliding_rail_pull_strength = 0.15000000596046448
	#Controls how much of an entity's motion a Sliding Rail preserves
	# Default: 0.800000011920929
	# Range: 0.0 ~ 1.0
	sliding_rail_damping = 0.800000011920929
	#Controls how long a Detector Sliding Rail stays powered (in ticks)
	# Default: 20
	# Range: 1 ~ 200
	detector_sliding_rail_hold_ticks = 20
	#Controls the damage dealt by Heaters
	# Default: 4.0
	# Range: 0.0 ~ 100.0
	heater_damage = 4.0
	#Controls the chance that using an item on a Chipped Anvil repairs it
	#Higher rolls consume the item without repairing anything
	#
	# Default: 0.9
	# Range: 0.0 ~ 1.0
	chipped_anvil_repair_chance = 0.9
	#Controls the chance that using an item on a Damaged Anvil repairs it to a full Anvil
	#Rolls between this chance and the chipped anvil repair chance degrade it to a Chipped Anvil instead
	#
	# Default: 0.1
	# Range: 0.0 ~ 1.0
	damaged_anvil_repair_chance = 0.1
	#Controls how often Chocolate Blocks apply their effects (in ticks)
	# Default: 80
	# Range: 1 ~ 1200
	chocolate_block_effect_period = 80
	#Controls how long the effects of Chocolate Blocks last (in ticks)
	# Default: 180
	# Range: 1 ~ 24000
	chocolate_block_effect_duration = 180
	#Controls the chance that overheated Ember Metal turns into a Netherite Block
	# Default: 0.05
	# Range: 0.0 ~ 1.0
	overheated_ember_metal_netherite_chance = 0.05
	#Controls how many times an Enchanted Gold Ingot makes Piglins barter
	# Default: 4
	# Range: 1 ~ 16
	enchanted_gold_barter_multiplier = 4
	#Controls how long the Monolith hint stays before it fades (in ticks)
	# Default: 100
	# Range: 1 ~ 1200
	monolith_hint_ticks = 100
	#Controls the radius the Monolith hint searches for players (in blocks)
	# Default: 5
	# Range: 1 ~ 32
	monolith_hint_range = 5
	#Controls how long the Monolith return confirmation lasts (in ticks)
	# Default: 60
	# Range: 1 ~ 1200
	monolith_return_confirmation_ticks = 60
	#Controls how long the Monolith Core takes to accept an offering (in ticks)
	# Default: 100
	# Range: 1 ~ 1200
	monolith_offering_ticks = 100
	#Controls how long the Monolith Core takes to dissolve an offering (in ticks)
	# Default: 60
	# Range: 1 ~ 1200
	monolith_dissolve_ticks = 60
	#Controls the radius of the Black Hole's gravity field (in blocks)
	# Default: 7
	# Range: 1 ~ 64
	black_hole_radius = 7
	#Controls the strength of the Black Hole's gravity field
	# Default: 10.0
	# Range: -1000.0 ~ 1000.0
	black_hole_strength = 10.0
	#Controls the radius of the White Hole's gravity field (in blocks)
	# Default: 7
	# Range: 1 ~ 64
	white_hole_radius = 7
	#Controls the strength of the White Hole's gravity field
	# Default: -10.0
	# Range: -1000.0 ~ 1000.0
	white_hole_strength = -10.0
	#Controls the water absorption chance of Cut Ember Metal Blocks
	# Default: 0.1
	# Range: 0.0 ~ 1.0
	cut_ember_metal_block_water_absorption_chance = 0.1
	#Controls how many blocks a sliding structure may push at most (also scales the detector rail signal)
	#A piston push limit changed by another mod takes precedence over this value
	#
	# Default: 12
	# Range: 1 ~ 256
	sliding_rail_max_push_depth = 12
	#Controls the chance that a falling NeoForge anvil takes damage on impact
	# Default: 0.01
	# Range: 0.0 ~ 1.0
	neoforge_anvil_damage_chance = 0.01

#Adjusts settings related to machines, power transmission, and storage logistics
