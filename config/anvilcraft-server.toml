#Server-wide Overworld sky and lunar travel mode. Vanilla keeps the original sky and midnight travel window. Special uses modeled celestial bodies and permits travel when the Moon is overhead. Applies to every player.
#Allowed Values: VANILLA, SPECIAL
overworld_sky_mode = "VANILLA"

#Adjusts settings related to world physics, anvil impacts, and block behavior
[world]
	#Controls the number of orbital integration substeps per tick for freely falling items and blocks (1 = legacy motion)
	# Default: 8
	# Range: 1 ~ 64
	orbit_integration_substeps = 8
	#Controls whether to enable Schwarzschild periapsis advance around attractive gravity sources
	relativistic_precession = true
	#Controls the minimum strength a gravity source needs to produce relativistic precession
	# Default: 10.0
	# Range: 0.0 ~ 1000.0
	relativistic_precession_min_strength = 10.0
	#Controls the effective speed of light used by orbital precession (in blocks/tick)
	#Larger values weaken the effect
	# Default: 64
	# Range: 16 ~ 4096
	orbital_speed_of_light = 64
	#Controls the maximum depth a lightning strike can reach (in blocks)
	# Default: 2
	# Range: 1 ~ 16
	lightning_strike_depth = 2
	#Controls the maximum radius a lightning strike can reach (in blocks)
	lightning_strike_radius = 1
	#Controls the maximum radius of the Giant Anvil's Shock (in blocks)
	# Default: 16
	# Range: 4 ~ 16
	giant_anvil_max_shock_radius = 16
	#Controls the maximum fall damage dealt by the Giant Anvil (-1 means infinity)
	# Default: 40
	# Range: -1 ~ 1000
	giant_anvil_max_fall_damage = 40
	#Controls the minimum collision speed at which Anvils explode instead of merely stopping (in blocks/tick)
	anvil_collision_craft_speed = 16
	#Controls the length of Redstone EMP generated per block dropped by the Anvil (in blocks)
	# Default: 6
	# Range: 1 ~ 64
	redstone_emp_radius = 6
	#Controls the maximum length of Redstone EMP (in blocks)
	# Default: 24
	# Range: 1 ~ 64
	redstone_emp_max_radius = 24
	#Controls the maximum distance for the Block Placer to recursively retrieve items from containers (in blocks)
	# Default: 7
	# Range: 0 ~ 20
	block_placer_max_recursive_retrieval_distance = 7
	#Controls whether the Block Devourer devours blocks upward in a chain (see #anvilcraft:block_devourer_chain_devouring)
	block_devourer_upward_chain_devouring = true
	#Controls the maximum distance of the Block Devourer's upward chain devouring (in blocks)
	# Default: 8
	# Range: 0 ~ 15
	block_devourer_upward_chain_devouring_distance = 8
	#Controls whether the Block Devourer protects containers (blocks that can store items) from being devoured
	block_devourer_protect_containers = false
	#Controls whether pushing or pulling a Sliding Rail chains to other Sliding Rails
	sliding_rail_stick_to_each_other = false
	#Controls the range in which the Active Silencer mutes sounds (in blocks)
	# Default: 31
	# Range: 3 ~ 64
	active_silencer_range = 31
	#Controls the minimum size of the Crafting Table multiblock the Giant Anvil can craft (in blocks)
	# Default: 3
	# Range: 3 ~ 15
	giant_anvil_multiblock_min_size = 3
	#Controls the maximum size of the Crafting Table multiblock the Giant Anvil can craft (in blocks)
	# Default: 15
	# Range: 3 ~ 31
	giant_anvil_multiblock_max_size = 15
	#Controls the safe fall distance in the Mun dimension (in blocks)
	# Default: 20.0
	# Range: 0.0 ~ 512.0
	mun_safe_fall_distance = 20.0
	#Controls the fall distance per damage in the Mun dimension (in blocks/damage)
	# Default: 6.0
	# Range: 0.0 ~ 64.0
	mun_blocks_per_damage = 6.0
	#Controls the delay before an Overworld-Like dimension collapses (in ticks)
	# Default: 40
	# Range: 1 ~ 1200
	overworld_like_collapse_delay_ticks = 40
	#Controls the bonus Neutronium Ingot chance per enchantment level when transcending (in %)
	# Default: 10
	# Range: 0 ~ 100
	transcendium_bonus_ingot_chance_per_enchantment = 10
	#Controls the experience points granted per block of EXP Fluid (in XP/block)
	# Default: 50
	# Range: 0 ~ 1000
	exp_fluid_xp_per_block = 50
	#Controls the number of neighbouring Void Matter Blocks needed for a Void Matter Block to decay
	# Default: 5
	# Range: 1 ~ 6
	void_matter_decay_threshold = 5
	#Controls the chance that a settled source of Cement solidifies per random tick
	# Default: 0.1
	# Range: 0.0 ~ 1.0
	cement_solidify_chance = 0.1
	#Controls the chance that the Block Devourer suppresses the drops of the block it eats
	# Default: 0.05
	# Range: 0.0 ~ 1.0
	block_devourer_drop_suppression_chance = 0.05
	#Controls the chance that Redhot Blocks absorb water
	# Default: 0.5
	# Range: 0.0 ~ 1.0
	redhot_water_absorb_chance = 0.5
	#Controls the chance that Ember Blocks absorb water
	# Default: 0.5
	# Range: 0.0 ~ 1.0
	ember_block_water_absorption_chance = 0.5
	#Controls the damage a falling Giant Anvil deals per block fallen
	# Default: 10.0
	# Range: 0.0 ~ 1000.0
	giant_anvil_fall_damage_per_block = 10.0
	#Controls the speed a powered Sliding Rail launches entities with (in blocks/tick)
	# Default: 0.3499999940395355
	# Range: 0.0 ~ 10.0
	sliding_rail_launch_speed = 0.3499999940395355
	#Controls the strength an unpowered Sliding Rail pulls entities with
	# Default: 0.15000000596046448
	# Range: 0.0 ~ 10.0
	sliding_rail_pull_strength = 0.15000000596046448
	#Controls the fraction of an entity's motion a Sliding Rail preserves
	# Default: 0.800000011920929
	# Range: 0.0 ~ 1.0
	sliding_rail_damping = 0.800000011920929
	#Controls the duration a Detector Sliding Rail stays powered (in ticks)
	# Default: 20
	# Range: 1 ~ 200
	detector_sliding_rail_hold_ticks = 20
	#Controls the damage dealt by Heaters
	# Default: 4.0
	# Range: 0.0 ~ 100.0
	heater_damage = 4.0
	#Controls the chance that using an item on a Chipped Anvil repairs it
	#Higher rolls consume the item without repairing anything
	# Default: 0.9
	# Range: 0.0 ~ 1.0
	chipped_anvil_repair_chance = 0.9
