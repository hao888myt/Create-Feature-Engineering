		# Range: 1 ~ 60
		work_interval = 10
		#Controls the energy efficiency of power converters (1 kW => xx FE/t)
		# Default: 100
		# Range: 1 ~ 1000
		efficiency = 100
		#Controls the power loss of power converters
		loss = 0.1

	#Adjusts settings related to the Storage Port
	[machines.storage_port]
