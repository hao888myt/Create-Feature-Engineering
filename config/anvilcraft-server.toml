#Adjusts settings related to the commands the Spacetime Supercomputer may execute
[commands]
	#Controls whether to allow the /locate biome command
	allow_locate_biome_command = true
	#Controls whether to allow the /locate structure command
	allow_locate_structure_command = true
	#Controls whether to allow the /locate poi command
	allow_locate_poi_command = true
	#Controls whether to allow the /time add command
	allow_time_add_command = true
	#Controls whether to allow the /tick sprint command
	allow_tick_sprint_command = true
	#Controls the number of power grid entries the power grid command shows
	# Default: 256
	# Range: 1 ~ 4096
	powergrid_info_limit = 256
