	#Rolls between this chance and the Chipped Anvil repair chance degrade it to a Chipped Anvil instead
	# Default: 0.1
	# Range: 0.0 ~ 1.0
	damaged_anvil_repair_chance = 0.1
	#Controls the interval at which Chocolate Blocks apply their effects (in ticks)
	# Default: 80
	# Range: 1 ~ 1200
	chocolate_block_effect_period = 80
	#Controls the effect duration of Chocolate Blocks (in ticks)
	# Default: 180
	# Range: 1 ~ 24000
	chocolate_block_effect_duration = 180
	#Controls the chance that an Overheated Block of Ember Metal turns into a Block of Netherite
	# Default: 0.05
	# Range: 0.0 ~ 1.0
	overheated_ember_metal_netherite_chance = 0.05
	#Controls the number of times an Enchanted Gold Ingot makes Piglins barter
	# Default: 4
	# Range: 1 ~ 16
	enchanted_gold_barter_multiplier = 4
	#Controls the duration of the Monolith hint before it fades (in ticks)
	# Default: 100
	# Range: 1 ~ 1200
	monolith_hint_ticks = 100
	#Controls the radius the Monolith hint searches for Monolith Cores (in blocks)
	# Default: 5
	# Range: 1 ~ 32
	monolith_hint_range = 5
	#Controls the duration of the Monolith return confirmation (in ticks)
	# Default: 60
	# Range: 1 ~ 1200
	monolith_return_confirmation_ticks = 60
	#Controls the time the Monolith Core takes to accept an offering (in ticks)
	# Default: 100
	# Range: 1 ~ 1200
	monolith_offering_ticks = 100
	#Controls the time the Monolith Core takes to dissolve an offering (in ticks)
	# Default: 60
	# Range: 1 ~ 1200
	monolith_dissolve_ticks = 60
	#Controls the radius of the Black Hole's gravity field (in blocks)
	# Default: 7
	# Range: 1 ~ 64
	black_hole_radius = 7
	#Controls the strength of the Black Hole's gravity field
	# Default: 10.0
	# Range: -1000.0 ~ 1000.0
	black_hole_strength = 10.0
	#Controls the radius of the White Hole's gravity field (in blocks)
	# Default: 7
	# Range: 1 ~ 64
	white_hole_radius = 7
	#Controls the strength of the White Hole's gravity field
	# Default: -10.0
	# Range: -1000.0 ~ 1000.0
	white_hole_strength = -10.0
	#Controls the water absorption chance of Cut Ember Metal Blocks
	# Default: 0.1
	# Range: 0.0 ~ 1.0
	cut_ember_metal_block_water_absorption_chance = 0.1
	#Controls the maximum number of blocks a sliding structure may push (also scales the Detector Sliding Rail signal)
	#A piston push limit changed by another mod takes precedence over this value
	# Default: 12
	# Range: 1 ~ 256
	sliding_rail_max_push_depth = 12
	#Controls the chance that a falling NeoForge takes damage on impact
	# Default: 0.01
	# Range: 0.0 ~ 1.0
	neoforge_anvil_damage_chance = 0.01
	#Controls the damage a falling NeoForge deals per block fallen
	# Default: 2.0
	# Range: 0.0 ~ 1000.0
	neoforge_fall_damage_per_block = 2.0
	#Controls the maximum fall damage dealt by the NeoForge (-1 means infinity)
	# Default: 20
	# Range: -1 ~ 1000
	neoforge_max_fall_damage = 20
	#Controls the damage a falling Royal Anvil deals per block fallen
	# Default: 2.0
	# Range: 0.0 ~ 1000.0
	royal_anvil_fall_damage_per_block = 2.0
	#Controls the maximum fall damage dealt by the Royal Anvil (-1 means infinity)
	# Default: 80
	# Range: -1 ~ 1000
	royal_anvil_max_fall_damage = 80
	#Controls the damage a falling Frost Anvil deals per block fallen
	# Default: 2.0
	# Range: 0.0 ~ 1000.0
	frost_anvil_fall_damage_per_block = 2.0
	#Controls the maximum fall damage dealt by the Frost Anvil (-1 means infinity)
	# Default: 120
	# Range: -1 ~ 1000
	frost_anvil_max_fall_damage = 120
	#Controls the damage a falling Ember Anvil deals per block fallen
	# Default: 2.0
	# Range: 0.0 ~ 1000.0
	ember_anvil_fall_damage_per_block = 2.0
	#Controls the maximum fall damage dealt by the Ember Anvil (-1 means infinity)
	# Default: 120
	# Range: -1 ~ 1000
	ember_anvil_max_fall_damage = 120
	#Controls the damage a falling Transcendence Anvil deals per block fallen
	# Default: 2.0
	# Range: 0.0 ~ 1000.0
	transcendence_anvil_fall_damage_per_block = 2.0
	#Controls the maximum fall damage dealt by the Transcendence Anvil (-1 means infinity)
	# Default: -1
	# Range: -1 ~ 1000
	transcendence_anvil_max_fall_damage = -1

