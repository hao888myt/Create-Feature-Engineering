	#Adjusts settings related to the Hyperdimension Uploader
	[machines.hyperdimension_uploader]
		#Controls the working interval of the Hyperdimension Uploader (in ticks)
		# Default: 5
		# Range: 1 ~ 1200
		work_interval = 5
		#Controls the maximum number of items the Hyperdimension Uploader moves to the bound storage per scan
		# Default: 64
		# Range: 1 ~ 1024
		max_items_per_scan = 64

