#Online settings let you change all options related to multiplayer.
[online_settings]
	#Remove speed limits imposed by server.
	#This removes most rollbacks but makes it easier to cheat on a server. (default: false)
	removeSpeedLimits = false

#Locomotion settings let you change all options related to movement on the ground.
[locomotion_settings]
	#Sprinting speed multiplier (default: 1.3 = 30% increase)
	# Default: 1.3
	# Range: 1.0 ~ 5.0
	sprintSpeedMultiplier = 1.0
	#Enable step height increase (default: true)
	enableStepHeightIncrease = false
	#Walking speed multiplier (default: 1.3 = 30% increase)
	# Default: 1.3
	# Range: 1.0 ~ 5.0
	walkSpeedMultiplier = 1.0
	#Enable safe fall height increase (default: true)
	enableSafeFallHeightIncrease = false
	#Enable omnidirectional sprinting (default: true)
	enableOmniSprint = true
	#Enable crawl (default: true)
	enableCrawl = true
	#Enable slide (default: true)
	enableSlide = true
	#Slide and evade cooldown in ticks (default: 12)
	# Default: 12
	# Range: > 0
	slideCooldown = 12
	#Slide boost speed (default: 0.7)
	# Default: 0.7
	# Range: 0.1 ~ 5.0
	slideBoostSpeed = 0.7
	#Enable turning without slowdown while sliding in the air (default: true)
	enableTapStrafing = true
	#Enable landing roll (default: true)
	enableLandingRoll = true
	#Landing roll window in ticks (default: 6)
	# Default: 6
	# Range: > 1
	landingRollWindow = 6
	#Enable move speed increase (default: true)
	enableMoveSpeedIncrease = true
	#Walking step height in blocks (default: 0.6, vanilla: 0.6)
	# Default: 0.6
	# Range: 0.6 ~ 1.5
	walkStepHeight = 0.6
	#Sprinting step height in blocks (default: 1.0, vanilla: 0.6)
	# Default: 1.1
	# Range: 0.6 ~ 1.5
	sprintStepHeight = 1.1
	#Safe fall height (default: 6.0)
	# Default: 6.0
	# Range: -3.0 ~ 1.7976931348623157E308
	safeFallHeight = 3.0
	#Enable walking and sneaking on top of entities (default: true)
	enableEntityWalking = true
	#Press jump again near an entity for one extra jump per airborne period (default: true)
	enableEntityJump = true
	#Maximum gap between hitboxes for an entity jump, in blocks (default: 0.6)
	# Default: 0.6
	# Range: 0.1 ~ 2.0
	entityJumpReach = 0.6

#Swimming settings let you change all options related to movement on the water.
[swimming_settings]
	#Enables swimming while sprinting through water (default: true)
	enableShallowSwimming = true
	#Enables speed boost while swimming (default: true)
	enableSwimmingBoost = true
	#Swimming boost speed multiplier (default: 0.4)
	# Default: 0.4
	# Range: 0.0 ~ 5.0
	swimmingBoostSpeedMultiplier = 0.4
	#Swimming boost cooldown in ticks (default: 12)
	# Default: 12
	# Range: > 0
	swimmingBoostCooldown = 12
	#Enables freestyle swimming (default: true)
	enableFreestyle = true
	#Enables stopping swimming when idle (default: true)
	enableStopSwimmingWhenIdle = true

#Wall movement settings let you change all options related to movement on the wall.
[wall_movement_settings]
	#Enable speed vault (default: true)
	enableSpeedVault = false
	#Allows climbing more block types (default: true)
	canClimbMoreBlocks = true
	#Enable sprint-key upward climb acceleration; disabling this removes all upward climb boosts (default: true)
	enableUpClimbSpeedIncrease = true
	#The sole target speed multiplier for sprint-key upward climbing; 1 adds no climb speed, subject to a safe speed limit (default: 1.25)
	# Default: 2.0
	# Range: 1.0 ~ 5.0
	upClimbSpeedMultiplier = 1.25
	#Enable sprint-key downward climb acceleration regardless of look direction; disabling this removes all downward climb boosts (default: true)
	enableClimbDownSpeedIncrease = true
	#The sole target speed multiplier for sprint-key downward climbing; 1 adds no climb speed, subject to a safe speed limit (default: 2.0)
	# Default: 2.0
	# Range: 1.0 ~ 5.0
	downClimbSpeedMultiplier = 2.0
	#Ease into the target speed over 8 ticks (about 0.4 seconds); when disabled, reach the same target immediately. This setting does not change the final target speed (default: true)
	enableClimbAccelerationOverTime = true
	#Climbable blocks do not slow down movement (default: true)
	climbableBlockNotSlowDown = true
	#Enable wall run (default: true)
	enableWallRun = true
	#Wall run duration in ticks (default: 30)
	# Default: 30
	# Range: > 0
	wallRunDuration = 30
	#Enable wall slide (default: true)
	enableWallSlide = true
	#Enable wall jump (default: true)
	enableWallJump = true
	#Enable armhang (default: true)
	enableArmhang = true
	#Armhang movement speed (default: 0.15)
	# Default: 0.15
	# Range: 0.05 ~ 1.0
	armhangMoveSpeed = 0.15
	#Armhang resets wall climb (default: true)
	armhangResetWallClimb = true
	#Enable support wall jump (default: true)
	enableSupportWallJump = true
	#Enable wall climb (default: true)
	enableWallClimb = true
	#Wall climb duration in ticks (default: 20)
	# Default: 20
	# Range: > 0
	wallClimbDuration = 20
	#Wall climb speed (default: 0.2)
	# Default: 0.2
	# Range: 0.05 ~ 1.0
	wallClimbSpeed = 0.2
	#Enable jumping during or shortly after a speed vault (default: true)
	enableSpeedVaultJump = true

#Horizontal bar swinging
[bar_swing_settings]
	#Automatically catch horizontal bars while airborne (default: true)
	enableBarSwing = true
	#Bar release jump strength multiplier (default: 1.0)
	# Default: 1.0
	# Range: 0.5 ~ 1.5
	barSwingJumpStrength = 1.0

#Animation settings let you change first-person parkour animations.
[animation_settings]
	#Enable first-person parkour arm animations while holding items (default: true). Bar swinging keeps its own animation.
	enableFirstPersonAnimations = true
	#Enable first-person crawl animations (default: true). Still respects enableFirstPersonAnimations while holding items. Does not affect crawling itself.
	enableCrawlFirstPersonAnimations = false
